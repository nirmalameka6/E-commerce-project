<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - ShopSphere</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-top" style="justify-content: center;">
                <a href="index.html" class="logo">
                    <i class="fas fa-shopping-bag"></i> ShopSphere
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="auth-card" style="max-width: 500px;">
            <div class="auth-header">
                <h1 class="auth-title">Create an Account</h1>
                <p class="auth-subtitle">Join ShopSphere to enjoy personalized shopping and fast checkout</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name" class="form-label">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="reg-email" class="form-label">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-mobile" class="form-label">Mobile Number</label>
                    <input type="tel" id="reg-mobile" class="form-control" placeholder="+91 9876543210" required>
                </div>

                <div class="form-group">
                    <label for="reg-password" class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="terms" required style="accent-color: var(--primary-color); cursor: pointer;">
                    <label for="terms" style="font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
                        I agree to the <a href="#" style="color: var(--primary-color);">Terms of Service</a> &amp; <a href="#" style="color: var(--primary-color);">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </main>

    <!-- JavaScript Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
