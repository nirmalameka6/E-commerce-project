<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopSphere</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-top" style="justify-content: center;">
                <a href="index.html" class="logo">
                    <i class="fas fa-shopping-bag"></i> ShopSphere
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your ShopSphere account to continue</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address / Mobile Number</label>
                    <input type="text" id="login-email" class="form-control" placeholder="user@example.com" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label for="login-password" class="form-label">Password</label>
                        <a href="#" style="font-size: 0.8rem; color: var(--primary-color);">Forgot password?</a>
                    </div>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="remember-me" style="accent-color: var(--primary-color); cursor: pointer;">
                    <label for="remember-me" style="font-size: 0.88rem; color: var(--text-muted); cursor: pointer;">Remember me for 30 days</label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Create an Account</a>
            </div>
        </div>
    </main>

    <!-- JavaScript Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
